<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title th:text="#{movie.title}">Movie Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 th:text="#{movie.title}">Movie Library</h1>

    <!-- Language switcher -->
    <div class="mb-3">
        <a href="?lang=en" th:href="@{/movies(lang='en')}">English</a> |
        <a href="?lang=ru" th:href="@{/movies(lang='ru')}">Русский</a>
    </div>

    <!-- Error Messages -->
    <div class="alert alert-success" th:if="${successMessage}">
        <span th:text="${successMessage}"></span>
    </div>
    <div class="alert alert-danger" th:if="${errorMessage}">
        <span th:text="${errorMessage}"></span>
    </div>

    <!-- Movie Form -->
    <form class="mb-5" method="post" th:action="@{/movies}" th:object="${movieDto}">
        <input th:field="*{id}" type="hidden">

        <div class="mb-3">
            <label class="form-label" for="title" th:text="#{movie.form.title}">Title</label>
            <input class="form-control" id="title" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                   th:field="*{title}"
                   type="text">
            <div class="invalid-feedback" th:errors="*{title}"
                 th:if="${#fields.hasErrors('title')}">Title error
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="description" th:text="#{movie.form.description}">Description</label>
            <textarea class="form-control" id="description" rows="3"
                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                      th:field="*{description}"></textarea>
            <div class="invalid-feedback" th:errors="*{description}"
                 th:if="${#fields.hasErrors('description')}">Description error
            </div>
        </div>

        <button class="btn btn-primary" th:text="#{movie.form.submit}" type="submit">Save Movie</button>
    </form>

    <form class="mb-4" method="get" th:action="@{/movies/search}">
        <div class="input-group">
            <input class="form-control" name="title" placeholder="Search by title..."
                   th:placeholder="#{movie.search.placeholder}"
                   type="text">
            <button class="btn btn-primary" th:text="#{movie.search.button}" type="submit">Search</button>
            <a class="btn btn-secondary" th:href="@{/movies}" th:text="#{movie.search.reset}">Reset</a>
        </div>
    </form>

    <!-- Movie List -->
    <h2 th:text="#{movie.list.title}">Movie List</h2>

    <table class="table table-striped">
        <thead>
        <tr>
            <th th:text="#{movie.form.title}">Title</th>
            <th th:text="#{movie.form.description}">Description</th>
            <th th:text="#{movie.list.action.delete}">Delete</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="movie : ${movies}">
            <td th:text="${movie.title}"></td>
            <td th:text="${movie.description}"></td>
            <td>
                <form method="post" th:action="@{/movies/delete}">
                    <input name="id" th:value="${movie.id}" type="hidden">
                    <button class="btn btn-sm btn-danger" th:text="#{movie.list.action.delete}"
                            type="submit">Delete
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
